[target]
  [target.aarch64-linux-ohos]
    compile-option = "--cfg target_platform=hos -B \"${DEVECO_CANGJIE_PATH}/build-tools/third_party/llvm/bin\" -B \"${DEVECO_OH_NATIVE_HOME}/sysroot/usr/lib/aarch64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/sysroot/usr/lib/aarch64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/llvm/lib/clang/15.0.4/lib/aarch64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/llvm/lib/aarch64-linux-ohos\" --sysroot \"${DEVECO_OH_NATIVE_HOME}/sysroot\""
    [target.aarch64-linux-ohos.bin-dependencies]
      path-option = [ "${AARCH64_LIBS}", "${AARCH64_MACRO_LIBS}", "${AARCH64_KIT_LIBS}", "${CJMP_SDK_HOME}/cjmp-tools/third_party/cangjie-stdx/linux_ohos_aarch64_cjnative/dynamic/stdx" ]

  [target.aarch64-linux-android26]
    compile-option = "--cfg target_platform=android --sysroot \"${ANDROID_NDK_DIR}/toolchains/llvm/prebuilt/${SYSTEM_STRING}/sysroot\" -L \"${ANDROID_NDK_DIR}/toolchains/llvm/prebuilt/${SYSTEM_STRING}/lib/clang/18/lib/linux\" -L \"${ANDROID_NDK_DIR}/toolchains/llvm/prebuilt/${SYSTEM_STRING}/sysroot/usr/lib/aarch64-linux-android/26\" -B \"${ANDROID_CANGJIE_PATH}/third_party/llvm/bin\""
    [target.aarch64-linux-android26.bin-dependencies]
      path-option = [ "${ANDROID_CJ_FRONTEND}", "${ANDROID_CJ_MACRO}", "${ANDROID_CANGJIE_STDX_PATH}", "${ANDROID_CJMP_LIBS_PATH}/ohos", "${ANDROID_CJMP_LIBS_PATH}/kit", "${ANDROID_TEST_PATH}", "${SCRIPT_BUILD_PATH}/java", "${ANDROID_CJ_FRONTEND}/../kit" ]
    [target.aarch64-linux-android26.dependencies]
      mirrors = { path = "android/cangjie_bridge/mirrors" }

  [target.aarch64-apple-ios]
    compile-option = "--cfg target_platform=ios --sysroot=${IOS_SDK_DIR}"
    [target.aarch64-apple-ios.bin-dependencies]
      path-option = ["${IOS_CJ_FRONTEND}", "${IOS_CJ_MACRO}", "${IOS_CANGJIE_STDX_PATH}", "${IOS_CJMP_LIBS_PATH}/ohos", "${IOS_CJMP_LIBS_PATH}/kit", "${IOS_TEST_PATH}", "${IOS_CJ_FRONTEND}/../kit" ]
    [target.aarch64-apple-ios.dependencies]
      mirrors = { path = "ios/cangjie_bridge" }

  [target.aarch64-apple-ios-simulator]
    compile-option = "--cfg target_platform=ios-sim --sysroot=${IOS_SIM_SDK_DIR}"
    [target.aarch64-apple-ios-simulator.bin-dependencies]
      path-option = ["${IOS_SIM_CJ_FRONTEND}/ohos", "${IOS_SIM_CJ_FRONTEND}/macro/ohos", "${IOS_SIM_CANGJIE_STDX_PATH}", "${IOS_SIM_CJMP_LIBS_PATH}/ohos", "${IOS_SIM_CJMP_LIBS_PATH}/kit", "${IOS_SIM_TEST_PATH}", "${CJMP_SDK_HOME}/cjmp-ui/ios-sim/kit" ]
    [target.aarch64-apple-ios-simulator.dependencies]
      mirrors = { path = "ios/cangjie_bridge" }

[dependencies]
  zlibraryAPI4CJ = { git = "https://gitcode.com/LiquidStudio/zlibraryAPI4CJ.git" }
  linderHttp = { git = "https://gitcode.com/LiquidStudio/LinderHttp.git" }
  CJson = { git = "https://gitcode.com/LiquidStudio/CJson.git" }

[package]
  cjc-version = "1.1.0"
  compile-option = "--error-count-limit 200"
  description = "Keels Application"
  link-option = ""
  name = "ohos_app_cangjie_entry"
  output-type = "dynamic"
  src-dir = "./common"
  target-dir = ""
  version = "1.0.0"
  [package.package-configuration]
  [package.scripts]

[profile]
  experimental = true
  [profile.build]
    incremental = true
    lto = ""
  [profile.customized-option]
    debug = "-g -Woff all"
    lto_android = "--lto-keep-pkg-visibility=ohos_app_cangjie_entry --static-std --static-libs -L \"${ANDROID_CJMP_LIBS_PATH}/java\" -ljava.cjmp_interop_ext -L \"${ANDROID_CJMP_LIBS_PATH}/cjmp\" -lcjmp.interop.java -L \"${ANDROID_ENGINE_PATH}/arm64-v8a\" -lkeels_android --link-options \"--whole-archive ${ANDROID_CANGJIE_PATH}/lib/linux_android_aarch64_cjnative/libjava.internal.a --no-whole-archive\" -O2 \"--lto=full\" -lc++_shared"
    lto_ios = "--lto-keep-pkg-visibility=ohos_app_cangjie_entry --static-std --static-libs -L \"${IOS_CJMP_LIBS_PATH}/cjmp\" -lcjmp.interop.objc -O2 \"--lto=full\" --experimental --link-options \"-install_name @rpath/libohos_app_cangjie_entry.dylib\" --link-options \"-undefined dynamic_lookup\""
    lto_ios_quiet = "--link-options \"-w\""
    lto_ios_verbose = "-V"
    release = "--fast-math -O2 -s -Woff all"
    withffi = "-L${FFI_BRIDGE} -lSelineRead_ffi"
  [profile.test]

[[source-set]]
  name = "common"
  src-dir = "./common"
  features = []

[[source-set]]
  name = "hos"
  src-dir = "./hos"
  features = ["os.ohos"]
  product = true

[[source-set]]
  name = "android"
  src-dir = "./android"
  features = ["os.android"]
  product = true



