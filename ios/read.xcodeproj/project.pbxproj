			shellScript = "set -e\nsource_dir=\"${CJMP_ARTIFACTS_DIR}\"\ndestination_dir=\"${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}\"\nif [[ ! -f \"${source_dir}/.complete\" ]]; then\n  echo \"error: CJMP artifact staging did not complete: ${source_dir}\" >&2\n  exit 1\nfi\nmkdir -p \"${destination_dir}\"\n# Remove only artifacts owned by the previous CJMP embed operation.\nmanifest_path=\"${destination_dir}/.cjmp-staged\"\nif [[ -f \"${manifest_path}\" ]]; then\n  while IFS= read -r artifact_name; do\n    case \"${artifact_name}\" in\n      */*) echo \"error: invalid CJMP artifact name: ${artifact_name}\" >&2; exit 1 ;;\n      *.dylib|*.framework) rm -rf \"${destination_dir}/${artifact_name}\" ;;\n    esac\n  done < \"${manifest_path}\"\nfi\n# Keep the ownership list even if copying or signing fails, so the next run cleans up.\nfind \"${source_dir}\" -maxdepth 1 \\( -type f -name '*.dylib' -o -type d -name '*.framework' \\) -exec basename {} \\; > \"${manifest_path}\"\nwhile IFS= read -r artifact_name; do\n  rm -rf \"${destination_dir}/${artifact_name}\"\n  cp -R \"${source_dir}/${artifact_name}\" \"${destination_dir}/\"\ndone < \"${manifest_path}\"\nif [[ \"${CODE_SIGNING_ALLOWED:-NO}\" == \"YES\" && -n \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" ]]; then\n  while IFS= read -r -d '' embedded_item; do\n    codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --preserve-metadata=identifier,entitlements \"${embedded_item}\"\n  done < <(find \"${destination_dir}\" -maxdepth 1 \\( -type f -name '*.dylib' -o -type d -name '*.framework' \\) -print0)\nfi\ntouch \"${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/.cjmp-staged\"\n";
