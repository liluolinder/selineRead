[package]
cjc-version = "1.1.0"
compile-option = "--dy-std --cfg=\"${COMPILE_CONDITION_ENTRY}\""
description = "CangjieUI Application"
link-option = ""
name = "ohos_app_cangjie_entry"
output-type = "dynamic"
src-dir = "./src/main/cangjie"
target-dir = ""
version = "1.0.0"
package-configuration = { }
scripts = { }


[profile]
[profile.build]
incremental = []
debug = "-g -Woff all -Won apilevel-check"
release = "--fast-math -O2 -s -Woff all -Won apilevel-check"
[profile.test]

[dependencies.zlibraryAPI4CJ]
path = "../features/cangjie/zlibraryAPI4CJ"
[dependencies.selineWebdav]
path = "../features/cangjie/selineWebdav"
[dependencies.selineDownload]
path = "../features/cangjie/selineDownload"
[dependencies.linderHttp]
path = "../features/cangjie/linderHttp"

[target]
[target.aarch64-linux-ohos]
compile-option = "-B \"${DEVECO_OH_NATIVE_HOME}/sysroot/usr/lib/aarch64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/sysroot/usr/lib/aarch64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/llvm/lib/clang/15.0.4/lib/aarch64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/llvm/lib/aarch64-linux-ohos\" -L \"${DEVECO_CANGJIE_HOME}/build/linux_ohos_aarch64_cjnative/openssl\" --sysroot \"${DEVECO_OH_NATIVE_HOME}/sysroot\" -B \"${DEVECO_CANGJIE_HOME}/build-tools/third_party/llvm/bin\""
[target.aarch64-linux-ohos.bin-dependencies]
path-option = ["${AARCH64_LIBS}", "${AARCH64_MACRO_LIBS}", "${AARCH64_KIT_LIBS}", "${CANGJIE_STDX_PATH}/linux_ohos_aarch64_cjnative/dynamic/stdx"]
[target.x86_64-linux-ohos]
compile-option = "-B \"${DEVECO_OH_NATIVE_HOME}/sysroot/usr/lib/x86_64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/sysroot/usr/lib/x86_64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/llvm/lib/clang/15.0.4/lib/x86_64-linux-ohos\" -L \"${DEVECO_OH_NATIVE_HOME}/llvm/lib/x86_64-linux-ohos\" -L \"${DEVECO_CANGJIE_HOME}/build/linux_ohos_x86_64_cjnative/openssl\" --sysroot \"${DEVECO_OH_NATIVE_HOME}/sysroot\" -B \"${DEVECO_CANGJIE_HOME}/build-tools/third_party/llvm/bin\""
[target.x86_64-linux-ohos.bin-dependencies]
path-option = ["${X86_64_OHOS_LIBS}", "${X86_64_OHOS_MACRO_LIBS}", "${X86_64_OHOS_KIT_LIBS}", "${CANGJIE_STDX_PATH}/linux_ohos_x86_64_cjnative/dynamic/stdx"]

